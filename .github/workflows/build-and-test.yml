name: btb-forestry docker build and CI test

on: 
  pull_request:
     branches:
       - main
     paths:
       - 'Dockerfile'
jobs:
  Build:
    runs-on: ubuntu:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.0

      - name: Docker build
        run: docker build -t defradigital/btb-forestry:${{ github.head_ref }} .

      - name: Docker Login
        uses: docker/login-action@v4.4.0
        with: 
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: defradigital/btb-forestry:${{ github.head_ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Nextflow
        uses: nf-core/setup-nextflow@6c2e22b4d901f0c42ca66c5069f8026df026d165
        with:
          version: '25.04.8'

      - name: Set secrets
        run: |
          nextflow secrets set BRANCH ${{ github.head_ref }}

      - name: Install nf-test
        run: |
          wget -qO- https://get.nf-test.com | bash
          sudo mv nf-test /usr/local/bin/

      - name: Run Tests
        run: nf-test test --ci
