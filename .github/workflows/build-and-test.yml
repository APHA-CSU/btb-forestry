name: btb-forestry docker build and CI test

on: 
  pull_request:
     branches:
       - main
     paths:
       - 'Dockerfile'
env:
  NODE_EXTRA_CA_CERTS: "/etc/ssl/certs/ca-certificates.crt"
  SSL_CERT_DIR: "/etc/ssl/certs"

jobs:
  Build:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Docker cleanup
        run: | 
          docker system prune -af
          docker builder prune -af
      - name: Docker build
        run: docker build -t ${{ secrets.CSU_ACCOUNT_NUMBER }}.dkr.ecr.eu-west-1.amazonaws.com/btb-forestry:${{ github.head_ref }} .
      - name: ECR Login
        run: |
          sudo aws ecr get-login-password --region eu-west-1 | sudo docker login --username AWS --password-stdin ${{ secrets.CSU_ACCOUNT_NUMBER }}.dkr.ecr.eu-west-1.amazonaws.com
      - name: ECR Push
        run: |
          sudo docker push ${{ secrets.CSU_ACCOUNT_NUMBER }}.dkr.ecr.eu-west-1.amazonaws.com/btb-forestry:${{ github.head_ref }}

#  CI_testing:
#    runs-on: self-hosted
#    needs: Build
#    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Nextflow
        uses: nf-core/setup-nextflow@6c2e22b4d901f0c42ca66c5069f8026df026d165
        with:
          version: '25.04.8'

      - name: Set secrets
        run: |
          nextflow secrets set ECR_ACCOUNT ${{ secrets.CSU_ACCOUNT_NUMBER }}
          nextflow secrets set BRANCH ${{ github.head_ref }}

      - name: Install nf-test
        run: |
          wget -qO- https://get.nf-test.com | bash
          sudo mv nf-test /usr/local/bin/

      - name: Run Tests
        run: nf-test test --ci
